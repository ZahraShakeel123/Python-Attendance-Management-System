<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Attendance Management System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='icon.ico') }}">
</head>
<body>
    <div class="header">
        <h1 class="system-title">Attendance Management System</h1>
        <div class="datetime-display">
            <div class="date" id="currentDate"></div>
            <div class="time" id="currentTime"></div>
        </div>
    </div>
    <div class="auth-container">
        <div class="auth-card">
            <h2>Reset Password</h2>
            <div id="alertMessage"></div>
            <form id="resetPasswordForm">
                <input type="hidden" id="email" name="email">
                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm New Password</label>
                    <input type="password" id="confirmPassword" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Reset Password</button>
                <div style="text-align: center; margin-top: 1rem;">
                    <a href="/login" style="color: var(--olive-green);">Back to Login</a>
                </div>
            </form>
        </div>
    </div>
    <script>
        // Get email from query param
        function getQueryParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }
        const email = getQueryParam('email');
        document.getElementById('email').value = email;
        document.getElementById('resetPasswordForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const alertDiv = document.getElementById('alertMessage');
            if (newPassword.length < 6) {
                alertDiv.innerHTML = '<div class="alert alert-error">Password must be at least 6 characters long</div>';
                return;
            }
            if (newPassword !== confirmPassword) {
                alertDiv.innerHTML = '<div class="alert alert-error">Passwords do not match</div>';
                return;
            }
            try {
                const response = await fetch('/api/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, new_password: newPassword })
                });
                const data = await response.json();
                if (response.ok) {
                    alertDiv.innerHTML = '<div class="alert alert-success">Your password has been reset. Please use your new password to log in.</div>';
                    setTimeout(() => { window.location.href = '/login'; }, 2000);
                } else {
                    alertDiv.innerHTML = '<div class="alert alert-error">' + (data.error || 'Failed to reset password') + '</div>';
                }
            } catch (err) {
                alertDiv.innerHTML = '<div class="alert alert-error">Error resetting password</div>';
            }
        });
        // Date/time update
        function updateDateTime() {
            const now = new Date();
            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
            const day = days[now.getDay()];
            const date = now.getDate();
            const month = months[now.getMonth()];
            const year = now.getFullYear();
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const seconds = now.getSeconds().toString().padStart(2, '0');
            document.getElementById('currentDate').textContent = `${day}, ${date} ${month} ${year}`;
            document.getElementById('currentTime').textContent = `${hours}:${minutes}:${seconds}`;
        }
        updateDateTime();
        setInterval(updateDateTime, 1000);
    </script>
</body>
</html>
