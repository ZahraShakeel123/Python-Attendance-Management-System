<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Management System</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='icon.ico') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="header">
        <h1 class="system-title">Attendance Management System</h1>
        <div class="datetime-display">
            <div class="date" id="currentDate"></div>
            <div class="time" id="currentTime"></div>
        </div>
    </div>
    
    <div class="container">
        <div class="auth-card" style="margin-top: 3rem;">
            <h2>Welcome to Attendance Management System</h2>
            <p style="text-align: center; margin-bottom: 2rem; color: #666;">
                Please choose an option to continue
            </p>
            <div style="display: flex; flex-direction: column; gap: 1rem;">
                <a href="{{ url_for('login_page') }}" class="btn btn-primary btn-block">Login</a>
                <a href="{{ url_for('register_page') }}" class="btn btn-secondary btn-block">Register</a>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
    <script>
        console.log('=== INDEX.HTML SCRIPT LOADED ===');
        console.log('Auth.js should be loaded above this message');
        function updateDateTime() {
            const now = new Date();
            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
            
            const day = days[now.getDay()];
            const date = now.getDate();
            const month = months[now.getMonth()];
            const year = now.getFullYear();
            
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const seconds = now.getSeconds().toString().padStart(2, '0');
            
            document.getElementById('currentDate').textContent = `${day}, ${date} ${month} ${year}`;
            document.getElementById('currentTime').textContent = `${hours}:${minutes}:${seconds}`;
        }
        
        updateDateTime();
        setInterval(updateDateTime, 1000);
    </script>
</body>
</html>
